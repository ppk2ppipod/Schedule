<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>2026 10월 후쿠오카트립</title><meta name="claude:viewport-fit-sides" content="cover"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap"><style id="app-css">
/* Layout: a station nameplate for the title, one boarding-pass strip for flights and hotel, then each day drawn as a transit line. Stops sit on a colored route, Plan B/C branch off it. Day colors follow the Fukuoka subway: airport line red, Hakozaki orange, Nanakuma green. */
:root{
  --bg:#EEF1F3; --surface:#FFFFFF; --ink:#1F2933; --muted:#566370; --line:#D3D9DF;
  --d1:#C8102E; --d2:#B35000; --d3:#0B7A3E; --on-d:#FFFFFF;
  --danger:#B42318; --scrim:rgba(16,21,26,.5); --shadow:16,21,26;
  --ease-out:cubic-bezier(.16,1,.3,1);
  --f-display:'Do Hyeon','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  --f-body:'IBM Plex Sans KR','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10151A; --surface:#1A2128; --ink:#F2F4F6; --muted:#A5AFBA; --line:#33404B;
    --d1:#FF6F81; --d2:#FFA552; --d3:#4DD18A; --on-d:#10151A;
    --danger:#FF8A7A; --scrim:rgba(0,0,0,.65);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10151A; --surface:#1A2128; --ink:#F2F4F6; --muted:#A5AFBA; --line:#33404B;
  --d1:#FF6F81; --d2:#FFA552; --d3:#4DD18A; --on-d:#10151A;
  --danger:#FF8A7A; --scrim:rgba(0,0,0,.65);
  color-scheme:dark;
}
.day-1{--day:var(--d1)}
.day-2{--day:var(--d2)}
.day-3{--day:var(--d3)}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px 120px; -webkit-text-size-adjust:100%;
}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--bg)}
button,input,select{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--ink); outline-offset:2px}
html{scrollbar-color:var(--line) var(--bg); accent-color:var(--d1)}
::selection{background:color-mix(in srgb,var(--d1) 24%,transparent); color:var(--ink)}
input,textarea{caret-color:var(--d1)}
a{text-underline-offset:.2em}
h1{text-wrap:balance}
.wrap{max-width:560px; margin:0 auto}

/* nameplate */
.plate{background:var(--surface); border:1px solid var(--line); border-radius:8px; overflow:hidden}
.bands{display:grid; grid-template-columns:repeat(3,1fr); height:10px}
.bands i:nth-child(1){background:var(--d1)}
.bands i:nth-child(2){background:var(--d2)}
.bands i:nth-child(3){background:var(--d3)}
.plate-in{padding:14px 16px 16px; display:grid; gap:6px}
h1{margin:0; font:400 clamp(34px,11vw,46px)/1.05 var(--f-display); letter-spacing:.01em}
.sub{display:flex; justify-content:space-between; align-items:center; gap:10px}
.roman{font-size:16px; font-weight:500; color:var(--muted)}
.dday{font:400 22px/1 var(--f-display); padding:7px 12px; border-radius:6px; background:var(--ink); color:var(--surface)}
.plate-foot{display:flex; justify-content:space-between; align-items:center; gap:8px 12px; flex-wrap:wrap; margin-top:2px}
.meta{display:flex; flex-wrap:wrap; gap:0 14px; font-size:15px; font-weight:600; font-variant-numeric:tabular-nums}
.pill{appearance:none; min-height:44px; padding:0 18px; border:1.5px solid var(--ink); border-radius:999px; background:transparent; font:700 15px var(--f-body); cursor:pointer}
.pill[aria-pressed="true"]{background:var(--ink); color:var(--surface)}

/* flights and hotel */
.pass{margin-top:14px; padding:2px 16px; background:var(--surface); border:1px solid var(--line); border-radius:8px}
.seg{display:grid; gap:10px; padding:14px 0}
.seg-h{display:flex; justify-content:space-between; align-items:baseline; gap:8px; font-size:15px; color:var(--muted)}
.seg-h b{color:var(--ink); font-weight:700; font-size:16px; margin-right:6px}
.seg-b{display:grid; grid-template-columns:auto 1fr auto; align-items:start; gap:12px}
.pt{display:grid; gap:4px}
.pt.r{justify-items:end; text-align:right}
.code{font:400 30px/1 var(--f-display); letter-spacing:.01em}
.tm{font-size:18px; font-weight:700; font-variant-numeric:tabular-nums; line-height:1.2}
.term{font-size:14px; color:var(--muted); line-height:1.3}
.gate{justify-self:start; display:inline-flex; align-items:center; height:26px; margin-top:2px; padding:0 10px; border-radius:6px; background:var(--ink); color:var(--surface); font-size:14px; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap}
.gate.tbd{background:transparent; color:var(--muted); border:1.5px dashed var(--line)}
.arrow{display:block; margin-top:9px; color:var(--muted)}
.arrow svg{display:block; width:100%; height:12px}
.cut{position:relative; border-top:2px dashed var(--line); margin:0 -16px}
.cut::before,.cut::after{content:""; position:absolute; top:-9px; width:16px; height:16px; border-radius:50%; background:var(--bg)}
.cut::before{left:-8px}
.cut::after{right:-8px}
.seg.hotel{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px 20px}
.hn{font-size:18px; font-weight:700; line-height:1.3}
.hn a{color:inherit; text-decoration:none; -webkit-tap-highlight-color:transparent}
.hn .go{--day:var(--ink)}
@media (hover:hover){.hn a:hover{text-decoration:underline}}
.hr{font-size:15px; color:var(--muted)}
.ci{display:flex; gap:22px}
.ci div{display:grid; gap:2px}
.ci span{font-size:14px; color:var(--muted)}
.ci b{font-size:18px; font-weight:700; font-variant-numeric:tabular-nums}

/* day tabs */
.tabs{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:5; margin-top:18px;
  display:grid; grid-template-columns:repeat(3,1fr) 1.25fr;
  background:var(--bg); box-shadow:0 0 0 100vmax var(--bg); clip-path:inset(0 -100vmax);
}
.tab{
  appearance:none; position:relative; display:flex; align-items:center; justify-content:center; gap:8px;
  min-height:62px; padding:10px 2px 8px; border:0; border-bottom:4px solid var(--line); background:none; cursor:pointer; text-align:left;
}
.tab[aria-selected="true"]{border-bottom-color:var(--day)}
.bd{flex:none; display:grid; place-items:center; width:30px; height:30px; border-radius:7px; background:var(--day); color:var(--on-d); font:400 20px/1 var(--f-display)}
.tab[aria-selected="false"] .bd{opacity:.5}
.tx{display:grid; line-height:1.25; min-width:0}
.tx b{font-size:16px; font-weight:700}
.tx small{font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums}
.tab[aria-selected="false"] .tx b{font-weight:500}
.tab em{position:absolute; top:2px; right:2px; font-style:normal; font-size:12px; font-weight:700; color:var(--day)}
.day-pack{--day:var(--ink); --on-d:var(--surface)}
.bd svg{width:20px; height:20px}
@media (max-width:480px){
  .tab{flex-direction:column; gap:4px; min-height:78px; text-align:center}
  .tx{justify-items:center}
  .tx b{font-size:15px; white-space:nowrap}
  .tx small{font-size:12px}
}

/* packing list */
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.pk-h{margin:20px 0 0; font:400 26px/1.1 var(--f-display)}
.pk-sum{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px 12px; margin-top:12px; font-size:15px; color:var(--muted)}
.pk-sum b{font:400 24px/1 var(--f-display); color:var(--ink); font-variant-numeric:tabular-nums}
.pk-bar{height:6px; margin-top:10px; border-radius:3px; background:var(--line); overflow:hidden}
.pk-bar i{display:block; height:100%; border-radius:3px; background:var(--d3); transition:width .45s var(--ease-out)}
.pk{list-style:none; margin:14px 0 0; padding:0; background:var(--surface); border:1px solid var(--line); border-radius:8px}
.pk li{display:flex; align-items:center; gap:8px; padding:0 8px 0 14px; border-top:1px solid var(--line)}
.pk li:first-child{border-top:0}
.pk label{flex:1; min-width:0; display:flex; align-items:center; gap:12px; min-height:54px; padding:8px 0; cursor:pointer}
.pk input[type=checkbox]{flex:none; width:24px; height:24px; margin:0; accent-color:var(--d3); cursor:pointer}
.pk input[type=checkbox]:disabled{cursor:default}
.pk-t{font-size:16px; overflow-wrap:anywhere}
.pk .done .pk-t{color:var(--muted); text-decoration:line-through; text-decoration-thickness:1.5px}
.pk .tb{min-height:40px}
.pk-edit{flex:1; min-width:0; display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:8px 0}
.pk-edit input{flex:1 1 160px; min-width:0; min-height:44px; padding:8px 12px; border:1.5px solid var(--ink); border-radius:8px; background:var(--bg); color:var(--ink); font-size:16px}
.pk-add{display:flex; gap:8px; margin-top:12px}
.pk-add input{flex:1; min-width:0; min-height:48px; padding:10px 12px; border:1.5px solid var(--line); border-radius:8px; background:var(--surface); color:var(--ink); font-size:16px}
.pk-add input:focus-visible{border-color:var(--ink); outline-offset:0}
.pk-hint{margin:10px 0 0; font-size:14px; color:var(--muted)}

/* a day as a transit line */
#daysec{scroll-margin-top:calc(80px + env(safe-area-inset-top,0px))}
.refs{display:flex; flex-wrap:wrap; gap:8px; margin:16px 0 0}
.ref{padding:6px 12px; border:1.5px solid var(--day); border-radius:999px; font-size:14px; font-weight:600; font-variant-numeric:tabular-nums}
.editbar{margin:16px 0 0; padding:12px 14px; border:1.5px dashed var(--day); border-radius:8px; font-size:14px; line-height:1.5}
.editbar .tools{margin-top:10px}
.empty{margin:20px 0 0; color:var(--muted)}
.tl{list-style:none; margin:18px 0 0; padding:0}
.it{position:relative; min-width:0; padding:6px 0 26px 46px}
.it::before{content:""; position:absolute; left:14px; top:0; bottom:0; width:8px; background:var(--day)}
.it:first-child::before{top:17px}
.it:last-child::before{bottom:auto; height:17px}
.it.ba:last-child::before{height:calc(100% - 26px)}
.it::after{content:""; position:absolute; left:7px; top:6px; width:22px; height:22px; border-radius:50%; background:var(--surface); border:5px solid var(--day)}
.hd{display:flex; flex-wrap:wrap; align-items:center; gap:4px 8px; min-height:22px}
.when{font-size:16px; font-weight:700; color:var(--day); font-variant-numeric:tabular-nums}
.ttl{font-size:17px; font-weight:600; line-height:1.35; overflow-wrap:anywhere}
.hd + .ttl{margin-top:3px}
.nt{margin-top:2px; font-size:15px; color:var(--muted); overflow-wrap:anywhere}
.stop{display:block; color:inherit; text-decoration:none; -webkit-tap-highlight-color:transparent}
a.stop{padding:10px 0; margin:-10px 0}
a.stop:active .ttl{text-decoration:underline}
.go{display:inline-flex; align-items:center; gap:4px; height:24px; margin-left:8px; padding:0 9px 0 6px; border:1.5px solid var(--day); border-radius:999px; font-size:13px; font-weight:700; line-height:1; vertical-align:2px; white-space:nowrap}
.go svg{width:14px; height:14px}
.memo{margin-top:8px; padding:8px 12px; background:color-mix(in srgb,var(--day) 9%,var(--surface)); border-radius:8px; font-size:15px; line-height:1.5; white-space:pre-wrap; overflow-wrap:anywhere}
.alt .memo{background:color-mix(in srgb,var(--day) 9%,var(--bg))}
.pp{display:inline-flex; align-items:center; height:24px; padding:0 10px; border:1.5px solid var(--ink); border-radius:999px; font-size:13px; font-weight:700; white-space:nowrap}
.pp.a{background:var(--day); border-color:var(--day); color:var(--on-d)}
.alts{display:grid; gap:10px; margin-top:12px}
.alt{position:relative; min-width:0; padding:10px 12px 12px; background:var(--surface); border:1px solid var(--line); border-radius:8px}
.alt::before{content:""; position:absolute; right:100%; top:20px; width:24px; height:4px; background:var(--day)}
.alt .hd + .ttl{margin-top:4px}
.tools{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px}
.tb{appearance:none; display:inline-flex; align-items:center; justify-content:center; min-height:44px; min-width:44px; padding:0 14px; border:1.5px solid var(--line); border-radius:999px; background:var(--surface); font:600 14px var(--f-body); cursor:pointer}
.tb.add{border-color:var(--ink)}
.tb.dg{color:var(--danger); border-color:var(--danger)}
.tb:disabled{opacity:.4; cursor:default}

/* floating + and save bar */
.dock{
  position:fixed; z-index:20; pointer-events:none;
  left:max(16px,env(safe-area-inset-left,0px)); right:max(16px,env(safe-area-inset-right,0px)); bottom:calc(16px + env(safe-area-inset-bottom,0px));
  display:flex; justify-content:flex-end; align-items:center; gap:10px;
}
.dock > *{pointer-events:auto}
.fab{appearance:none; display:grid; place-items:center; width:58px; height:58px; border:0; border-radius:50%; background:var(--day); color:var(--on-d); cursor:pointer; box-shadow:0 6px 16px rgba(var(--shadow),.3)}
.fab svg{width:26px; height:26px}
.dk{appearance:none; min-height:48px; padding:0 18px; border:0; border-radius:999px; background:var(--ink); color:var(--surface); font:700 15px var(--f-body); cursor:pointer; box-shadow:0 6px 16px rgba(var(--shadow),.25)}
.dk.ghost{background:var(--surface); color:var(--ink); border:1.5px solid var(--line)}
.dk:disabled{opacity:.6; cursor:default}

/* edit sheet */
#sheet{position:fixed; inset:0; z-index:30; display:flex; align-items:flex-end; justify-content:center}
.scrim{position:absolute; inset:0; background:var(--scrim)}
.panel{
  position:relative; width:100%; max-width:560px; max-height:calc(100% - 12px); overflow-y:auto; display:grid; gap:8px;
  background:var(--surface); border-radius:16px 16px 0 0;
  padding:20px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));
}
.panel h2{margin:0; font-size:20px; font-weight:700}
.panel p{margin:0 0 4px; font-size:14px; color:var(--muted); overflow-wrap:anywhere}
.panel label{display:block; margin-top:4px; font-size:14px; font-weight:600; color:var(--muted)}
.panel input,.panel select,.panel textarea{width:100%; min-height:48px; padding:10px 12px; border:1.5px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); font-size:16px}
.panel textarea{min-height:96px; line-height:1.5; resize:vertical; font-family:inherit}
.panel p.hint{margin:4px 0 0; font-size:13px; color:var(--muted)}
.two{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.two > div{min-width:0}
.row{display:flex; gap:8px; margin-top:10px}
.btn{flex:1; appearance:none; min-height:48px; border:1.5px solid var(--ink); border-radius:999px; background:var(--ink); color:var(--surface); font:700 16px var(--f-body); cursor:pointer}
.btn.ghost{background:transparent; color:var(--ink); border-color:var(--line)}
.btn.danger{width:100%; background:transparent; color:var(--danger); border-color:var(--danger)}
/* states */
.pill,.tb,.btn,.dk,.fab,.tab{transition:transform .12s var(--ease-out),border-color .15s,background-color .15s}
.pill:active,.tb:active:not(:disabled),.btn:active,.dk:active:not(:disabled),.fab:active{transform:scale(.96)}
@media (hover:hover){
  .tb:hover:not(:disabled){border-color:var(--ink)}
  .tb.dg:hover{background:color-mix(in srgb,var(--danger) 8%,var(--surface))}
  .pill:hover[aria-pressed="false"]{background:color-mix(in srgb,var(--ink) 7%,transparent)}
  .tab:hover[aria-selected="false"]{border-bottom-color:color-mix(in srgb,var(--day) 45%,var(--line))}
  .btn.ghost:hover,.dk.ghost:hover{border-color:var(--ink)}
  a.stop:hover .ttl{text-decoration:underline}
}
/* the one authored moment: the route draws itself when a day opens */
.draw .it::before{transform-origin:top; animation:route .7s var(--ease-out) both; animation-delay:calc(var(--i,0) * 45ms)}
@keyframes route{from{transform:scaleY(0)}to{transform:scaleY(1)}}
#sheet:not([hidden]) .panel{animation:rise .32s var(--ease-out)}
#sheet:not([hidden]) .scrim{animation:fade .2s ease-out}
@keyframes rise{from{transform:translateY(24px); opacity:.6}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important; transition:none!important}
}
#toast{
  position:fixed; left:50%; transform:translateX(-50%); bottom:calc(92px + env(safe-area-inset-bottom,0px)); z-index:40;
  width:max-content; max-width:min(calc(100vw - 32px),420px); padding:12px 16px; border-radius:10px;
  background:var(--ink); color:var(--bg); font-size:15px; line-height:1.4; text-align:center;

      var key = a === 'pack-clear' ? 'pack-clear' : id;
      if (ui.confirm === key) {
        if (a === 'pack-clear') { state.packing.forEach(function (x) { x.done = false; }); }
        else { state.packing = state.packing.filter(function (x) { return x.id !== id; }); }
        ui.confirm = null; packChanged();
      } else {
        ui.confirm = key; render();
        setTimeout(function () { if (ui.confirm === key) { ui.confirm = null; render(); } }, 3000);
      }
      return;
    }
    if (a === 'download') { downloadCopy(); toast('수정한 일정을 HTML 파일로 받았어요.'); return; }
    if (a === 'reset') {
      if (ui.discard) {
        state = JSON.parse(fileJSON); ui.discard = false;
        try { localStorage.removeItem(LOCAL_KEY); } catch (e) {}
        savedJSON = fileJSON; if (!state.days[ui.day]) { ui.day = 0; } render(); toast('처음 파일의 일정으로 되돌렸어요.');
      } else { ui.discard = true; render(); setTimeout(function () { if (ui.discard) { ui.discard = false; render(); } }, 3000); }
      return;
    }
    if (a === 'discard') {
      if (ui.discard) { state = JSON.parse(savedJSON); ui.discard = false; ui.edit = false; if (!state.days[ui.day]) { ui.day = 0; } render(); toast('고치기 전 일정으로 되돌렸어요.'); }
      else { ui.discard = true; render(); setTimeout(function () { if (ui.discard) { ui.discard = false; render(); } }, 3000); }
      return;
    }
    if (a === 'add-item') { openSheet({ mode: 'item-add', id: id || '' }); return; }
    if (a === 'edit-item') { openSheet({ mode: 'item-edit', id: id }); return; }
    if (a === 'add-alt') { openSheet({ mode: 'plan-add', id: id }); return; }
    if (a === 'edit-alt') { openSheet({ mode: 'plan-edit', id: id, alt: aid }); return; }
    if (a === 'edit-flight') { openSheet({ mode: 'flight', id: id }); return; }
    var f = find(id);
    if (!f) { return; }
    if (a === 'up' || a === 'down') {
      var arr = f.day.items, j = a === 'up' ? f.idx - 1 : f.idx + 1;
      if (j < 0 || j >= arr.length) { return; }
      var tmp = arr[f.idx]; arr[f.idx] = arr[j]; arr[j] = tmp;
      changed(f.item.id);
      return;
    }
    if (a === 'swap') {
      f.item.alts.forEach(function (x) {
        if (x.id === aid) {
          var t = f.item.title, n = f.item.note || '', m = f.item.map || '', mm = f.item.memo || '';
          f.item.title = x.title; f.item.note = x.note || ''; f.item.map = x.map || ''; f.item.memo = x.memo || '';
          x.title = t; x.note = n; x.map = m; x.memo = mm;
        }
      });
      changed(f.item.id);
      return;
    }
    if (a === 'del-alt') {
      if (ui.confirm === aid) {
        f.item.alts = f.item.alts.filter(function (x) { return x.id !== aid; });
        changed(f.item.id);
      } else {
        ui.confirm = aid; render();
        setTimeout(function () { if (ui.confirm === aid) { ui.confirm = null; render(); } }, 3000);
      }
    }
  });

  function packChanged(focusAdd) {
    ui.discard = false;
    if (LOCAL) {
      if (localStore()) { savedJSON = JSON.stringify(state); }
      else if (!ui.hinted) { ui.hinted = true; toast('이 브라우저에는 저장할 수 없어요. 닫기 전에 HTML 파일로 받아 두세요.'); }
    }
    render();
    if (focusAdd) { var inp = document.getElementById('pk-new'); if (inp) { inp.focus(); } }
  }
  app.addEventListener('change', function (e) {
    var t = e.target;
    if (!t.matches || !t.matches('[data-act="pack-toggle"]')) { return; }
    state.packing.forEach(function (x) { if (x.id === t.getAttribute('data-id')) { x.done = t.checked; } });
    packChanged();
  });
  app.addEventListener('submit', function (e) {
    if (e.target.classList.contains('pk-edit')) {
      e.preventDefault();
      var pid = e.target.getAttribute('data-id'), ei = document.getElementById('pk-edit-in'), nt = ei ? ei.value.trim() : '';
      if (!nt) { toast('이름을 비워 둘 수 없어요. 지우려면 삭제를 누르세요.'); if (ei) { ei.focus(); } return; }
      state.packing.forEach(function (x) { if (x.id === pid) { x.text = nt; } });
      ui.packEdit = null; packChanged();
      return;
    }
    if (e.target.id !== 'pk-add') { return; }
    e.preventDefault();
    var inp = document.getElementById('pk-new'), text = inp ? inp.value.trim() : '';
    if (!text) { if (inp) { inp.focus(); } return; }
    state.packing.push({ id: uid('p'), text: text, done: false });
    packChanged(true);
  });

  render();
  if (restoreY !== null) { window.scrollTo(0, restoreY); }

  /* only people who can edit this page see the edit controls; a local copy is always editable */
  if (LOCAL) { ui.canEdit = true; render(); }
  else {
    window.claude.use('user').then(function (u) {
      var ok = false;
      try { ok = !!(u && (u.canEdit() || u.isOwner())); } catch (e) { ok = false; }
      if (ok) { ui.canEdit = true; render(); if (restoreY !== null) { window.scrollTo(0, restoreY); } }
    }).catch(function () {});
  }
})();
</script></body></html>
